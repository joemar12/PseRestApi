name: Run Sync Job

on:
  workflow_dispatch:   # manual trigger
  schedule:
    - cron: "0 11 * * 1-5"   # runs every 11am utc (7pm ph time) mondays-fridays

jobs:
  sync-job:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Run sync container
        run: |
          docker run --rm \
            -e ASPNETCORE_ENVIRONMENT="${{ vars.ASPNETCORE_ENVIRONMENT }}" \
            -e PseApiConfig__FramesUrl="${{ vars.PSEAPI_FRAMESURL }}" \
            -e PseApiConfig__Referer="${{ vars.PSEAPI_REFERRER }}" \
            -e ConnectionStrings__DefaultConnectionString="${{ secrets.CONNECTION_STRING }}" \
            ghcr.io/${{ github.repository }}/pse-stockprice-scraper:latest
