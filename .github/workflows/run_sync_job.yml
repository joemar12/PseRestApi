name: Run Stock Price Scraper

on:
  workflow_dispatch:   # manual trigger
  schedule:
    - cron: "0 22,04,11 * * 1-5"   # runs every 10pm, 4am, 11am utc (6am, 12nn, 7pm ph time) mondays-fridays

jobs:
  sync-job:
    runs-on: ubuntu-latest

    steps:
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Run sync container
        run: |
          docker run --rm \
            -e ASPNETCORE_ENVIRONMENT="${{ vars.ASPNETCORE_ENVIRONMENT }}" \
            -e PseApiConfig__FramesUrl="${{ vars.PSEAPI_FRAMESURL }}" \
            -e PseApiConfig__Referer="${{ vars.PSEAPI_REFERRER }}" \
            -e ConnectionStrings__DefaultConnectionString="${{ secrets.CONNECTION_STRING }}" \
            ghcr.io/${{ github.repository_owner }}/pserestapi/pse-stockprice-scraper:latest
